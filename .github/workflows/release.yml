name: Publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: start service container
      run: |
        docker run --rm -d --name rustfs -p 9000:9000 \
          -e RUSTFS_ACCESS_KEY=testadmin \
          -e RUSTFS_SECRET_KEY=testadmin \
          rustfs/rustfs:latest

        curl -s -D- --retry 30 --retry-delay 1 --retry-all-errors http://localhost:9000 \
          || { docker logs rustfs; exit 1; }

    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-version: 'latest'
    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-stack
      with:
        path: ~/.stack
        key: ${{ matrix.runner }}-${{ matrix.arch }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/stack.yaml') }}
        restore-keys: |
          ${{ matrix.runner }}-${{ matrix.arch }}-build-${{ env.cache-name }}-
          ${{ matrix.runner }}-${{ matrix.arch }}-build-
          ${{ matrix.runner }}-${{ matrix.arch }}-
    - name: Build dependencies
      run: |
        stack --no-terminal build --test --only-dependencies
    - name: Build
      run: |
        mkdir dist
        stack --no-terminal build --test --no-run-tests --copy-bins --local-bin-path dist
    - name: Test
      run: |
        export TASKRUNNER_TEST_S3_ENDPOINT=http://localhost:9000
        export TASKRUNNER_TEST_S3_ACCESS_KEY=testadmin
        export TASKRUNNER_TEST_S3_SECRET_KEY=testadmin

        stack --no-terminal build --test
    - name: Package
      run: |
        cd dist
        # Create architecture-specific archive
        tar czvf taskrunner-linux-${{ matrix.arch }}.tar.gz taskrunner
        # For x86_64, also create legacy name for backward compatibility
        if [ "${{ matrix.arch }}" == "x86_64" ]; then
          cp taskrunner-linux-${{ matrix.arch }}.tar.gz taskrunner-linux.tar.gz
        fi
    # Upload artifacts from both architecture builds
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: taskrunner-linux-${{ matrix.arch }}
        path: |
          dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: ls -laR artifacts/

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        files: |
          ./artifacts/taskrunner-linux-x86_64/taskrunner-linux.tar.gz
          ./artifacts/taskrunner-linux-x86_64/taskrunner-linux-x86_64.tar.gz
          ./artifacts/taskrunner-linux-arm64/taskrunner-linux-arm64.tar.gz
